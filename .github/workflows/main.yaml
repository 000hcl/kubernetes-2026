name: Release application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  IMAGE: dwk-environments
  SERVICE: dwk-environments
  BRANCH: ${{ github.ref_name }}
  NAMESPACE: ${{ github.ref_name == 'main' && 'project' || github.ref_name }}


jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: main

    steps:
    - name: Checkout
      uses: actions/checkout@v6


    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
        service_account: "${{ secrets.SERVICE_ACCOUNT }}"

    - name: 'Set up Cloud SDK'
      uses: google-github-actions/setup-gcloud@v3

    - name: 'Use gcloud CLI'
      run: gcloud info
    
    - run: gcloud --quiet auth configure-docker $REGISTRY

    - name: 'Get GKE credentials'
      uses: 'google-github-actions/get-gke-credentials@v3'
      with:
        cluster_name: '${{ env.GKE_CLUSTER }}'
        project_id: '${{ env.PROJECT_ID }}'
        location: '${{ env.GKE_ZONE }}'
    - name: Build todo-app
      run: |
        echo "TODO_APP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"
        docker build \
          --tag "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA" \
          ./todo-app

    - name: Push todo-app
      run: docker push "$TODO_APP_IMAGE"

    - name: Build todo-backend
      run: |
        echo "TODO_BACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"
        docker build \
          --tag "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA" \
          ./todo-backend

    - name: Push todo-backend
      run: docker push "$TODO_BACKEND_IMAGE"

    - name: Set up Kustomize
      uses: imranismail/setup-kustomize@v3

    - name: Deploy
      run: |-
        kubectl create namespace ${NAMESPACE} || true
        kubectl config set-context --current --namespace=${NAMESPACE}
        kustomize edit set namespace ${NAMESPACE}
        kustomize edit set image \
          PROJECT/todo-app=$TODO_APP_IMAGE \
          PROJECT/todo-backend=$TODO_BACKEND_IMAGE

        kustomize build . | kubectl apply -f -

        kubectl rollout status deployment/todo-app -n ${NAMESPACE}
        kubectl rollout status deployment/todo-backend -n ${NAMESPACE}

        kubectl get services -o wide


on:
  delete:

jobs:
  setup-delete-env:
    name: Set up and delete environment
    runs-on: ubuntu-latest
    environment: main

    steps:
    - name: Change env variables
      run: echo "BRANCH=${{ github.event.ref }}" >> "$GITHUB_ENV"

    - run: |
        if [ "${{ github.event.ref }}" = "main" ]; then
          echo "NAMESPACE=project" >> "$GITHUB_ENV"
        else
          echo "NAMESPACE=${{ github.event.ref }}" >> "$GITHUB_ENV"
        fi

    - name: Checkout
      uses: actions/checkout@v6


    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
        service_account: "${{ secrets.SERVICE_ACCOUNT }}"

    - name: 'Set up Cloud SDK'
      uses: google-github-actions/setup-gcloud@v3

    - name: 'Use gcloud CLI'
      run: gcloud info
    
    - run: gcloud --quiet auth configure-docker $REGISTRY

    - name: 'Get GKE credentials'
      uses: 'google-github-actions/get-gke-credentials@v3'
      with:
        cluster_name: '${{ env.GKE_CLUSTER }}'
        project_id: '${{ env.PROJECT_ID }}'
        location: '${{ env.GKE_ZONE }}'
    
    - name: Delete environment
      run: |-
        kubectl delete namespace ${NAMESPACE}
