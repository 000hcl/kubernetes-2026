apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-job
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: todo-job
            image: heclll/jobscript:0.4
            imagePullPolicy: IfNotPresent
            env:
            - name: URL
              value: "http://todo-backend-svc:1123/api/todos"
          restartPolicy: OnFailure
